# CRD Rakazo override — for Rakazo v0.1.6 ONLY.
# Hotfix web_fetch / remote MCP (upstream #808/#875/#876), fetched at install time from
# jaturapornchai/mybotdemo01@b539632 (modified Rakazo files, Apache-2.0) — see NOTICE.md.
# Gemma-specific hotfixes (computer-tools, pi-openai-compatible-provider) are intentionally NOT used.
# Remove the hotfix mounts after upgrading to a Rakazo release that contains those fixes.
x-hotfix: &hotfix
  - ./hotfix/web-ssrf.ts:/app/packages/adapters/src/web-ssrf.ts:ro
  - ./hotfix/keyless-http-web.ts:/app/packages/adapters/src/keyless-http-web.ts:ro
  - ./hotfix/undici-fetch.ts:/app/packages/adapters/src/undici-fetch.ts:ro
  - ./hotfix/remote-mcp.ts:/app/packages/adapters/src/remote-mcp.ts:ro
  # CRD: allow Office attachments (.xlsx/.docx/.pptx) for api/worker (web uses the rebuilt image below).
  # Generated at install time from the v0.1.6 app image (30-install-rakazo.sh step 4b). Remove when upstream supports them.
  - ./hotfix/contracts-attachments.ts:/app/packages/contracts/src/attachments.ts:ro
  - ./hotfix/core-attachments.ts:/app/packages/core/src/attachments.ts:ro
  # CRD: skills as built-ins (every account sees them). Generated by scripts/wsl/build-skills.sh.
  - ./hotfix/builtin-skills.ts:/app/packages/adapters/src/builtin-skills.ts:ro
  # CRD: "Rakazo" -> "crd-bot" in model billing notes and the bots' self-description (30-install-rakazo.sh step 4c)
  - ./hotfix/pi-models.ts:/app/packages/adapters/src/pi-models.ts:ro
  - ./hotfix/pi-oauth.ts:/app/packages/adapters/src/pi-oauth.ts:ro
  - ./hotfix/pi-runtime.ts:/app/packages/adapters/src/pi-runtime.ts:ro
services:
  web:
    # Web rebuilt with the same Office-attachment hotfix so users can upload .xlsx/.docx/.pptx
    # (local image built by 30-install-rakazo.sh step 5b; pull_policy never = `dc pull` skips it)
    image: crd/app:v0.1.6-office
    pull_policy: never
  worker:
    volumes: *hotfix
  api:
    volumes: *hotfix
  supervisor:
    environment:
      # Bot computer image = upstream computer:v0.1.6 + Thai fonts + Python libs + /opt/crd-skills
      # (built by 30-install-rakazo.sh / build-skills.sh)
      RAKAZO_COMPUTER_IMAGE: crd/computer:v0.1.6-crd
